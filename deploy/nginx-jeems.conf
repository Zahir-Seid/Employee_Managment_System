# Install as /etc/nginx/sites-available/jeems and link it into sites-enabled.
# <<< CHANGE: server_name (twice if you add a www name) and the root/alias paths
# if your project is not in /srv/jeems.
upstream jeems_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name jeems.example.org;
    server_tokens off;

    root /srv/jeems/frontend/dist;
    index index.html;

    # Report submissions can carry several photos.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://jeems_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploaded photos and files.
    location /media/ {
        alias /srv/jeems/backend/media/;
        expires 7d;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }
}
