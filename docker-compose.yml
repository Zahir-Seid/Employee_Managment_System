services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-jeems_db}
      POSTGRES_USER: ${DB_USER:-jeems}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: "5432"
      # One trusted proxy (this stack's nginx) in front of Django; the
      # 3 gunicorn workers share throttle counters via the file cache.
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-1}"
      CACHE_BACKEND: "${CACHE_BACKEND:-filebased}"
      CACHE_LOCATION: /tmp/ems-cache
    volumes:
      - media:/app/media
      - private_media:/app/private_media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media:
  private_media:
  postgres_data:
